name: Update F-Droid Repository

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fdroid.yml'
      - '.github/fdroid/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build F-Droid repo for (e.g. v12.10.3)'
        required: false
        default: 'v12.10.3'

permissions:
  contents: write

concurrency:
  group: "fdroid-repo"
  cancel-in-progress: true

jobs:
  fdroid:
    name: Build & Publish F-Droid Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver python3-yaml

      - name: Build F-Droid repository
        run: |
          mkdir -p fdroid_build
          cd fdroid_build

          # Run fdroid init to discover environment and setup baseline config
          fdroid init

          # Overwrite default keystore with ExteraMS release.keystore
          cp ../TMessagesProj/release.keystore keystore.p12

          # Copy launcher icon for the repository
          if [ -f ../TMessagesProj/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            mkdir -p icons
            cp ../TMessagesProj/src/main/res/mipmap-xxxhdpi/ic_launcher.png icons/icon.png
          fi

          # Safely update config.yml using Python
          python3 -c "
          import yaml
          with open('config.yml') as f:
              cfg = yaml.safe_load(f)

          cfg['repo_url'] = 'https://moltenst4r.github.io/ExteraMS/fdroid/repo'
          cfg['repo_name'] = 'ExteraMS F-Droid Repository'
          cfg['repo_icon'] = 'icon.png'
          cfg['repo_description'] = 'Официальный F-Droid репозиторий ExteraMS — Material Design 3 Telegram Client'
          cfg['keystore'] = 'keystore.p12'
          cfg['keystorepass'] = 'android'
          cfg['repo_keyalias'] = 'exterams'
          cfg['keypass'] = 'android'
          cfg['archive_older'] = 0

          with open('config.yml', 'w') as f:
              yaml.dump(cfg, f, default_flow_style=False)
          "

          # Restrict permissions as required by fdroidserver
          chmod 600 config.yml

          # Download APK files directly from GitHub Release
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export TARGET_TAG="${{ github.event.inputs.tag || github.event.release.tag_name || 'v12.10.3' }}"
          python3 -c "
          import json, urllib.request, os
          repo = os.environ.get('GITHUB_REPOSITORY', 'MoltenSt4r/ExteraMS')
          tag = os.environ.get('TARGET_TAG', 'v12.10.3')
          url = f'https://api.github.com/repos/{repo}/releases/tags/{tag}'
          print(f'Fetching release info from {url}...')
          req = urllib.request.Request(url, headers={'User-Agent': 'Actions-Runner'})
          try:
              data = json.loads(urllib.request.urlopen(req).read().decode())
              os.makedirs('repo', exist_ok=True)
              found = False
              for asset in data.get('assets', []):
                  name = asset.get('name', '')
                  if name.endswith('.apk'):
                      found = True
                      dl = asset.get('browser_download_url')
                      target_path = os.path.join('repo', name)
                      print(f'Downloading {name}...')
                      urllib.request.urlretrieve(dl, target_path)
                      print(f'Downloaded {name} ({os.path.getsize(target_path)} bytes)')
              if not found:
                  raise RuntimeError(f'No APK assets found in release {tag}')
          except Exception as e:
              print(f'Error downloading APK: {e}')
              raise
          "

          # Copy app metadata
          if [ -f ../.github/fdroid/metadata/com.exterams.app.yml ]; then
            mkdir -p metadata
            cp ../.github/fdroid/metadata/com.exterams.app.yml metadata/
          fi

          # Update and sign repository metadata
          fdroid update --create-metadata --verbose

          echo "Repository generation finished successfully."
          ls -la repo/

      - name: Prepare GitHub Pages deployment artifacts
        run: |
          mkdir -p deploy_pages/fdroid

          # Copy repo output
          cp -r fdroid_build/repo deploy_pages/fdroid/
          if [ -d fdroid_build/icons ]; then
            cp -r fdroid_build/icons deploy_pages/fdroid/
          fi

          # Prevent Jekyll processing on GitHub Pages
          touch deploy_pages/.nojekyll
          touch deploy_pages/fdroid/.nojekyll

          # Root redirect to main project hub
          cat << 'EOF' > deploy_pages/index.html
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=https://moltenstar.space/#exterams">
            <title>ExteraMS</title>
          </head>
          <body>
            <p>Перенаправление на <a href="https://moltenstar.space/#exterams">moltenstar.space</a>...</p>
          </body>
          </html>
          EOF

          # F-Droid landing redirect
          cat << 'EOF' > deploy_pages/fdroid/index.html
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=https://moltenstar.space/#exterams">
            <title>ExteraMS F-Droid Repository</title>
          </head>
          <body>
            <p>Перенаправление на <a href="https://moltenstar.space/#exterams">moltenstar.space</a>...</p>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: deploy_pages
          clean: false
