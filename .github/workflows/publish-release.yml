name: Publish Existing Build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID to publish'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact from previous run
        uses: actions/download-artifact@v4
        with:
          name: Release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk_release

      - name: Inspect downloaded files
        run: |
          ls -la apk_release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v12.10.3
          name: MoltenGram v12.10.3
          make_latest: true
          body: |
            ### Релиз MoltenGram v12.10.3

            **Брендинг и внешний вид:**
            - Ребрендинг проекта в **MoltenGram** (имя пакета `com.moltengram.app`, заголовок чатов по умолчанию `MoltenGram`).
            - Новые иконки приложения:
              - **MoltenGram MD3** (по умолчанию) — адаптивная иконка в стиле Material You / Monet с правильным масштабированием без обрезки краев маской лаунчера.
              - **MoltenStar** — кремовый волнистый фон и эмблема MoltenStar.
              - **MoltenGram Dotted** — точечный вариант логотипа.
            - Старые иконки `exteraless` полностью удалены.
            - Фирменная иконка кнопки отправки сообщений (самолётик MoltenGram с прозрачной звездой).
            - Обновлены логотипы на экране входа (сплэш) и в меню настроек.
            - Секция «Благодарности» в настройках со ссылками на авторов и форки (`@exteraless`, `@NagramX`, `@materialgram`).
            - Разблокированы премиум-иконки лаунчера Telegram (Премиум, Турбо, Нокс).
            - Фирменные векторные иконки в статус-баре (уведомления) и Nothing Phone Glyph матрице (MoltenGram MD3).

            **Новый встроенный функционал («из коробки»):**
            - **Анимации ввода текста:** мягкое появление с размытием, вылет букв, частицы при удалении (пыль, искры, снежинки, лепестки, буквы), плавный и жидкий курсор, интерактивное превью в настройках.
              - *Особая благодарность создателям оригинальных плагинов:* @private_let, @TextAnimation, @mihailkotovski, @mishabotov.
            - **Папки-чипсы Material 3:** панель папок в стиле Material 3, стили (Filled / Outlined / Ghost), плавный морфинг скруглений (Capsule, Rounded, Soft, Square, Expressive, Custom), анимации переходов (Jelly, Squeeze, Press, Spring), настройка цветов и живой предпросмотр.
              - *Особая благодарность создателю оригинального плагина:* @RnPlugins.
            - **Улучшения плагинов:** поддержка прямого импорта скриптов `.py` с автоконвертацией, выбор формата экспорта (`.plugin` / `.py`), пакетное резервное копирование и восстановление всех плагинов со всеми настройками и правами в архив `.exteraplugins`.

            **Интерфейс и фиксы:**
            - Вход по ключу доступа (Passkey): нативная поддержка Google Password Manager, Proton Pass, Bitwarden, KeePassDX и др.
            - Исправлено графическое искажение логотипа Telegram на экране входа/интро при смене темы.
            - Зачищены неактуальные настройки шапки чата.
            - Официальные собственные API_ID (39205442) и API_HASH проекта MoltenGram.
            - Формат экспорта плагинов: `.plugin (Рекомендуется)` без лишних упоминаний Telegram.

            **Цифровая подпись:**
            - Сгенерирован чистый релизный сертификат подписи (исправлена ошибка `CA:TRUE`, из-за которой Google Play Защита блокировала установку).
            - Включены схемы подписи v1 (JAR), v2 и v3.
          files: apk_release/*.apk

      - name: Send APK to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APK_GLOB: "apk_release/*.apk"
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "секреты Telegram не заданы — отправка пропущена"
            exit 0
          fi
          pip install --quiet kurigram tgcrypto
          python3 .github/scripts/send_apk.py

      - name: Trigger F-Droid Repository Update
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT не задан — обновление F-Droid репозитория пропущено"
            exit 0
          fi
          echo "Отправка repository_dispatch в MoltenSt4r/fdroid..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GH_PAT" \
            https://api.github.com/repos/MoltenSt4r/fdroid/dispatches \
            -d '{"event_type": "update-repo"}'

