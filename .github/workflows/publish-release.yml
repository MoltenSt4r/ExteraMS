name: Publish Existing Build

on:
  push:
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID to publish'
        default: '36397536358'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact from previous run
        uses: actions/download-artifact@v4
        with:
          name: Release
          run-id: ${{ inputs.run_id || '36397536358' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk_release

      - name: Inspect downloaded files
        run: |
          ls -la apk_release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: ExteraMS Test Build
          body: |
            Тестовая сборка ExteraMS:
            - Заменён логотип на экране входа на ExteraMS без фона
            - Добавлена векторная MD3 (Monet) тематическая иконка
            - Обновлены адаптивные и стандартные иконки приложения
            - Брендинг ExteraMS и имя пакета com.exterams.app
          files: apk_release/*.apk
