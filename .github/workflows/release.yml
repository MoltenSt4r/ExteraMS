name: Release Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release.yml'
      - '!.github/scripts/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Post the APK to the Telegram channel'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "universal"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > TMessagesProj/release.keystore
            echo "signing key restored from secrets"
          else
            echo "using repository release keystore"
          fi
          ls -la TMessagesProj/release.keystore
          echo "Verifying keystore:"
          keytool -list -v -keystore TMessagesProj/release.keystore -storepass android || openssl pkcs12 -in TMessagesProj/release.keystore -passin pass:android -nodes | openssl x509 -text -noout
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleRelease
      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release
          path: |
            TMessagesProj/build/outputs/apk/release/*.apk
      - name: Clean up legacy test builds and existing release APKs
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'test-build'
              });
              if (release && release.data) {
                console.log('Deleting test-build release ID:', release.data.id);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.data.id
                });
              }
            } catch (e) {
              console.log('No test-build release to delete');
            }
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'v12.10.4-beta1'
              });
              if (release && release.data && release.data.assets) {
                for (const asset of release.data.assets) {
                  if (asset.name.endsWith('.apk')) {
                    console.log('Deleting superseded APK asset:', asset.name, asset.id);
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id
                    });
                  }
                }
              }
            } catch (e) {
              console.log('No existing v12.10.4-beta1 release assets to clean');
            }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          tag_name: v12.10.4-beta1
          name: ExteraMS v12.10.4-beta1
          prerelease: true
          make_latest: false
          body: |
            ### Бета-релиз ExteraMS v12.10.4-beta1

            **Material Design 3 & Google Chat стили:**
            - **Google Chat стиль поля ввода (MD3 Input Field):**
              - Вертикальная капсула «+» слева со скруглением 19dp и адаптивным акцентным фоном Monet.
              - Горизонтальный скруглённый контейнер-пилюля поля ввода (радиус 24dp).
              - Кнопка эмодзи расположена **внутри** поля ввода справа.
              - Кнопка быстрого фото и микрофон рядом с эмодзи в пустом состоянии с плавным переходом к кнопке отправки при наборе текста.
            - **Скругление Action Bar во всех разделах:**
              - Нижние углы Action Bar аккуратно скруглены радиусом 24dp (в чатах, списке диалогов, настройках и т.д.).
              - Настройки шапки чата: скрытие и изменение порядка элементов (аватар, аудиозвонок, видеозвонок, поиск, звук, меню).
            - **Меню вложений Material 3 (Google Chat Bottom Sheet):**
              - Аккуратная шторка со скруглением 28dp, Material drag handle и вертикальным списком опций (Фото, Камера, GIF, Файлы, Опрос, Геолокация, Контакт, Музыка).
              - Настройка видимости и порядка пунктов шторки в Настройки → Внешний вид → Меню вложений MD3.

            **Иконки и совместимость лаунчера:**
            - Аутентичные индивидуальные монохромные силуэты для лаунчеров NothingOS и Google Pixel для всех вариантов иконок (Премиум — звезда, Турбо — ракета, Винтаж — ретро-самолёт, Нокс — контурный самолётик, Классика/Аква — самолётик).

            **Пути и ссылки:**
            - Стандартный путь сохранения медиа изменён на `ExteraMS` с автоматической миграцией существующих конфигураций с `exteraless`.
            - Префикс ссылок настроек обновлён на `t.me/exterams/...` с полной обратной совместимостью старых ссылок `t.me/exteraless/...`.
          files: TMessagesProj/build/outputs/apk/release/*.apk
      - name: Send APK to Telegram
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[skip publish]') }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "секреты Telegram не заданы — отправка пропущена"
            exit 0
          fi
          pip install --quiet kurigram tgcrypto
          python3 .github/scripts/send_apk.py

      - name: Trigger F-Droid Repository Update
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/fdroid.yml/dispatches \
            -d '{"ref":"main","inputs":{"tag":"v12.10.4-beta1"}}' || true
